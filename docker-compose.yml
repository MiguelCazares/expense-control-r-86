services:
  route-control-db:
    image: postgres:18
    container_name: route-control-db
    ports:
      - '54380:5432'
    volumes:
      - postgresdb:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: route_control

  route-control-test-db:
    image: postgres:18
    container_name: route-control-test-db
    ports:
      - '54381:5432'
    volumes:
      - postgresdb_test:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: route_control_test

volumes:
  postgresdb:
    driver: local
  postgresdb_test:
    driver: local
